<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a40"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#ffffff"/>
  <!-- harness -->
  <rect x="20" y="30" width="520" height="270" rx="10" fill="#faf8f4" stroke="#8a3b12" stroke-width="1.5"/>
  <text x="36" y="54" fill="#8a3b12" font-weight="600" letter-spacing="1.5" font-size="11">HARNESS · THE BODY</text>
  <text x="524" y="54" fill="#8a3b12" font-size="11" text-anchor="end">control flow holds the loop</text>
  <!-- parts -->
  <g>
    <rect x="44" y="110" width="88" height="44" rx="6" fill="#fff" stroke="#3a3a40"/>
    <text x="88" y="130" text-anchor="middle" font-weight="600">Input</text>
    <text x="88" y="146" text-anchor="middle" font-size="10.5" fill="#5b5b60">perceive</text>

    <rect x="156" y="110" width="88" height="44" rx="6" fill="#fff" stroke="#3a3a40"/>
    <text x="200" y="130" text-anchor="middle" font-weight="600">Context</text>
    <text x="200" y="146" text-anchor="middle" font-size="10.5" fill="#5b5b60">working memory</text>

    <rect x="268" y="84" width="140" height="96" rx="8" fill="#14161a"/>
    <text x="338" y="106" text-anchor="middle" fill="#f4efe6" font-weight="600">Model · the mind</text>
    <text x="338" y="126" text-anchor="middle" fill="#cfc8bc" font-size="11">tokens in → next token</text>
    <path d="M300,142 C300,166 376,166 376,142" fill="none" stroke="#d98a52" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="338" y="172" text-anchor="middle" fill="#d98a52" font-size="10.5">append, repeat</text>

    <rect x="432" y="110" width="88" height="44" rx="6" fill="#fff" stroke="#3a3a40"/>
    <text x="476" y="130" text-anchor="middle" font-weight="600">Output</text>
    <text x="476" y="146" text-anchor="middle" font-size="10.5" fill="#5b5b60">act</text>
  </g>
  <text x="338" y="76" text-anchor="middle" font-size="10.5" fill="#5b5b60">model interface</text>
  <!-- flow arrows -->
  <line x1="132" y1="132" x2="154" y2="132" stroke="#3a3a40" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="244" y1="132" x2="266" y2="132" stroke="#3a3a40" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="408" y1="132" x2="430" y2="132" stroke="#3a3a40" stroke-width="1.4" marker-end="url(#a)"/>
  <!-- tool result loop -->
  <path d="M476,154 L476,240 L88,240 L88,156" fill="none" stroke="#8a3b12" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="282" y="258" text-anchor="middle" fill="#8a3b12" font-size="11.5">a tool's result comes back as input: go again</text>
  <!-- person -->
  <line x1="520" y1="132" x2="596" y2="132" stroke="#3a3a40" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="604" y="128" font-weight="600">person</text>
  <text x="604" y="144" font-size="10.5" fill="#5b5b60">words, hand back</text>
  <path d="M640,118 L640,14 L88,14 L88,108" fill="none" stroke="#3a3a40" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="364" y="10" text-anchor="middle" font-size="10.5" fill="#5b5b60">a request from the person</text>
  <!-- world -->
  <text x="282" y="286" text-anchor="middle" font-size="11" fill="#5b5b60">the world: files, programs, the shell — reached only through Output</text>
</svg>
