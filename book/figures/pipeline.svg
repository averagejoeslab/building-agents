<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a40"/>
    </marker>
  </defs>
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="20" y="26" fill="#8a3b12" font-weight="600" font-size="11" letter-spacing="1.2">BUILDING THE MIND</text>
  <g text-anchor="middle">
    <rect x="20" y="40" width="100" height="58" rx="6" fill="#fff" stroke="#3a3a40"/>
    <text x="70" y="62" font-weight="600">Architecture</text><text x="70" y="78" font-size="10.5" fill="#5b5b60">random weights</text><text x="70" y="91" font-size="10.5" fill="#5b5b60">Ch 5</text>
    <rect x="144" y="40" width="100" height="58" rx="6" fill="#fff" stroke="#3a3a40"/>
    <text x="194" y="62" font-weight="600">Pre-training</text><text x="194" y="78" font-size="10.5" fill="#5b5b60">all text</text><text x="194" y="91" font-size="10.5" fill="#5b5b60">Ch 7</text>
    <rect x="268" y="40" width="100" height="58" rx="6" fill="#fff" stroke="#3a3a40"/>
    <text x="318" y="62" font-weight="600">Mid-training</text><text x="318" y="78" font-size="10.5" fill="#5b5b60">the job's data</text><text x="318" y="91" font-size="10.5" fill="#5b5b60">Ch 8</text>
    <rect x="392" y="40" width="110" height="58" rx="6" fill="#fff" stroke="#3a3a40"/>
    <text x="447" y="62" font-weight="600">Post-training</text><text x="447" y="78" font-size="10.5" fill="#5b5b60">conversations</text><text x="447" y="91" font-size="10.5" fill="#5b5b60">Ch 9</text>
  </g>
  <g stroke="#3a3a40" stroke-width="1.3">
    <line x1="120" y1="69" x2="142" y2="69" marker-end="url(#a)"/><line x1="244" y1="69" x2="266" y2="69" marker-end="url(#a)"/><line x1="368" y1="69" x2="390" y2="69" marker-end="url(#a)"/>
  </g>
  <g font-size="10" fill="#8a3b12" text-anchor="middle">
    <text x="194" y="114">held-out loss</text><text x="318" y="114">held-out loss, shell check</text><text x="447" y="114">held-out conversations</text>
  </g>

  <text x="20" y="150" fill="#8a3b12" font-weight="600" font-size="11" letter-spacing="1.2">BUILDING THE BODY</text>
  <rect x="20" y="162" width="224" height="58" rx="6" fill="#faf8f4" stroke="#8a3b12"/>
  <text x="132" y="184" text-anchor="middle" font-weight="600">Harness + evaluation</text>
  <text x="132" y="200" text-anchor="middle" font-size="10.5" fill="#5b5b60">built around a capable model: 32/32</text>
  <text x="132" y="213" text-anchor="middle" font-size="10.5" fill="#5b5b60">Ch 10–15</text>

  <text x="392" y="150" fill="#8a3b12" font-weight="600" font-size="11" letter-spacing="1.2">TRAINING THE MIND IN ITS BODY</text>
  <g text-anchor="middle">
    <rect x="268" y="162" width="110" height="58" rx="6" fill="#14161a"/>
    <text x="323" y="184" fill="#f4efe6" font-weight="600">Examples</text><text x="323" y="200" fill="#cfc8bc" font-size="10.5">verified sessions</text><text x="323" y="213" fill="#cfc8bc" font-size="10.5">Ch 17</text>
    <rect x="402" y="162" width="110" height="58" rx="6" fill="#14161a"/>
    <text x="457" y="184" fill="#f4efe6" font-weight="600">Practice (RL)</text><text x="457" y="200" fill="#cfc8bc" font-size="10.5">graded tries</text><text x="457" y="213" fill="#cfc8bc" font-size="10.5">Ch 18</text>
    <rect x="536" y="162" width="88" height="58" rx="6" fill="#fff" stroke="#3a3a40"/>
    <text x="580" y="184" font-weight="600">Evaluate</text><text x="580" y="200" font-size="10.5" fill="#5b5b60">32 tasks</text><text x="580" y="213" font-size="10.5" fill="#5b5b60">Ch 19</text>
  </g>
  <g stroke="#3a3a40" stroke-width="1.3">
    <path d="M502,69 L525,69 L525,128 L323,128 L323,160" fill="none" marker-end="url(#a)"/>
    <line x1="244" y1="191" x2="266" y2="191" marker-end="url(#a)"/>
    <line x1="378" y1="191" x2="400" y2="191" marker-end="url(#a)"/>
    <line x1="512" y1="191" x2="534" y2="191" marker-end="url(#a)"/>
