  <path d="M580,220 L580,262 L323,262 L323,222" fill="none" stroke="#d98a52" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="452" y="280" text-anchor="middle" fill="#d98a52" font-size="11">what fell short decides the next round · Ch 20</text>
